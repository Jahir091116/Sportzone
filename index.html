<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORT ZONE S.C. | Catálogo Oficial</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-gold: #f39c12;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --whatsapp-green: #25d366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        header { background: linear-gradient(135deg, #111, #222); padding: 20px; text-align: center; border-bottom: 2px solid var(--accent-gold); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.8rem; color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; }
        header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; } }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent-gold); }
        .card-img { width: 100%; height: 150px; background-color: #252525; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #444; }
        @media(min-width: 768px) { .card-img { height: 180px; } }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 5px; }
        .card-price { color: var(--accent-gold); font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; }
        .btn-add { background-color: var(--accent-gold); color: #000; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; margin-top: auto; }
        .btn-add:active { opacity: 0.8; }
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top: 2px solid var(--accent-gold); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); z-index: 1000; }
        .cart-info { font-size: 1.1rem; font-weight: bold; }
        .btn-wa { background-color: var(--whatsapp-green); color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>Sport Zone S.C.</h1>
        <p>Streetwear & Accesorios Urbanos</p>
    </header>

    <div class="container">
        <div class="grid" id="product-grid"></div>
    </div>

    <div class="cart-bar">
        <div class="cart-info" id="cart-total">Carrito: 0 ítems ($0.00)</div>
        <a href="#" class="btn-wa" id="whatsapp-btn" onclick="sendWhatsApp(event)">Pedir por WhatsApp</a>
    </div>

    <script>
        const products = [
            { id: 1, name: "Crocs Urban Classic", price: 25.00, emoji: "👟" },
            { id: 2, name: "Gorra Snapback Street", price: 15.00, emoji: "🧢" },
            { id: 3.0, name: "Lentes de Sol UV400", price: 12.00, emoji: "🕶️" },
            { id: 4, name: "Camiseta Oversized S.Z.", price: 20.00, emoji: "👕" },
            { id: 5, name: "Taquillos Fútbol Pro", price: 45.00, emoji: "⚽" },
            { id: 6, name: "Riñonera Deportiva", price: 18.00, emoji: "👜" }
        ];

        let cart = {};

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <div class="card-img">${p.emoji}</div>
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">$${p.price.toFixed(2)}</div>
                        <button class="btn-add" onclick="addToCart(${p.id})">Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCart();
        }

        function updateCart() {
            let count = 0;
            let total = 0;
            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                count += cart[id];
                total += p.price * cart[id];
            }
            document.getElementById('cart-total').innerText = `Items: ${count} | Total: $${total.toFixed(2)}`;
        }

        function sendWhatsApp(e) {
            e.preventDefault();
            let count = 0;
            for (let id in cart) count += cart[id];
            if (count === 0) {
                alert("Por favor selecciona al menos un producto.");
                return;
            }
            let text = "¡Hola Sport Zone S.C.! 🛍️ Me interesa hacer el siguiente pedido:%0A";
            let total = 0;
            for (let id in cart) {
                let p = products.find(prod => prod.id == id);
                text += `- ${cart[id]}x ${p.name} ($${(p.price * cart[id]).toFixed(2)})%0A`;
                total += p.price * cart[id];
            }
            text += `%0ATotal aproximado: $${total.toFixed(2)}. Quedo atento/a para coordinar la entrega.`;
            window.open(`https://wa.me/50760029048?text=${text}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
