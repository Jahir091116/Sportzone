<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPORT ZONE - Zona Deportiva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#00d5c8;color:#000}
header{position:sticky;top:0;z-index:10;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
header b{font-size:18px;letter-spacing:1px}
header small{background:#00d5c8;color:#000;padding:2px 8px;border-radius:12px;font-weight:bold;font-size:11px}
.cart-btn{background:#00d5c8;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15);text-align:center;padding-bottom:10px}
.card img{width:100%;height:180px;object-fit:cover}
.badge{background:#000;color:#00d5c8;display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:bold;margin:6px 0}
.name{font-size:13px;font-weight:bold;padding:0 6px;height:32px}
.price{color:#ff0000;font-weight:bold;font-size:19px;margin:4px 0}
.btn-black{background:#000;color:#fff;width:90%;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:5px}
.btn-black:active{background:#333}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:11}
#cart-modal{position:fixed;top:0;right:-100%;width:85%;max-width:360px;height:100%;background:#fff;z-index:12;transition:.3s;overflow-y:auto;padding:20px}
#cart-modal.open{right:0}
.cart-item{display:flex;gap:10px;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:10px}
.cart-item img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.qty button{padding:4px 8px;border-radius:4px;border:1px solid #000;background:#fff;cursor:pointer;font-size:12px}
.checkout-btn{background:#25D366;color:#fff;width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
.clear-btn{width:100%;margin-top:8px;background:#eee;border:none;padding:10px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<div><b>SPORT ZONE</b><br><small>Envios a todo Panama - Entrega Inmediata</small></div>
<button class="cart-btn" onclick="toggleCart()">Carrito <span id="cart-count">0</span></button>
</header>

<div class="grid" id="catalog"></div>

<div id="overlay" onclick="toggleCart()"></div>
<div id="cart-modal">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
<h3>Tu Carrito</h3><button onclick="toggleCart()" style="background:none;border:none;font-size:22px;cursor:pointer">X</button>
</div>
<div id="cart-items"></div>
<div id="cart-total"
