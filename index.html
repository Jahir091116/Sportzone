<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORT ZONE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#00e5d4}
header{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px;position:sticky;top:0;z-index:10}
header span{background:#00e5d4;color:#000;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold}
.cart-btn{background:#00e5d4;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:14px;padding:10px;text-align:center}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}
.price{color:red;font-weight:bold;font-size:19px;margin:5px 0}
.btn{background:#000;color:#fff;width:100%;padding:10px;border:none;border-radius:8px;font-weight:bold;margin-top:5px}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;z-index:20}
#cart{position:fixed;top:0;right:-100%;width:88%;max-width:360px;height:100%;background:#fff;z-index:21;transition:.3s;padding:18px;overflow:auto}
#cart.open{right:0}
.checkout{background:#25D366;color:#fff;width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px}
#lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;justify-content:center;align-items:center;z-index:30}
#lightbox.open{display:flex}
#lightbox img{max-width:92%;max-height:82%;border-radius:12px}
.navbtn{position:absolute;top:50%;background:rgba(255,255,255,.3);border:none;color:#fff;font-size:28px;padding:10px 14px;border-radius:50%}
#prev{left:12px}#next{right:12px}
#closeLb{position:absolute;top:15px;right:18px;background:none;border:none;color:#fff;font-size:32px}
</style>
</head>
<body>
<header><div><b>SPORT ZONE</b> <span>Envios a todo Panama</span></div><button class="cart-btn" onclick="toggleCart()">Carrito <span id="count">0</span></button></header>
